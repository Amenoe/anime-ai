server:
  # 8012 = 前端 dev，3000 = NestJS 后端；AI 服务用 8013
  port: 8013

spring:
  application:
    name: anime-ai
  web:
    error:
      # ⚠️ Spring Boot 4 把 server.error.* 迁到了 spring.web.error.*，
      # 旧名被标记为 deprecation level=error，写了**静默不生效**（实测踩过：
      # 写成 server.error.include-message 后响应体依然只有
      # {"status":400,"error":"Bad Request"}，完全看不出原因）。
      # 本服务只被 anime-chat-server 在内网调用，不是公开接口，
      # 带出 message 是为了排障：否则「语料源返回 0 条」与
      # 「jdbc URL 的 characterEncoding 写错」在响应体里长得一模一样。
      include-message: always
  threads:
    virtual:
      enabled: true

  # 读项目根目录的 .env（KEY=VALUE）。
  #
  # 之前只能靠 shell `export`，与另两个仓（dotenv 读 .env.development）体验不一致，
  # 重启终端就丢。这里用 Boot 自带的 config data 机制加载，零额外依赖；
  # `optional:` 保证没有 .env 时也能启动（例如生产上只用真实环境变量）。
  #
  # ⚠️ .env 必须放在**进程工作目录**下：`mvn spring-boot:run` 会在项目根目录找；
  #    若在别处运行 jar，需改用绝对路径 file:/path/to/.env[.properties]。
  config:
    import: optional:file:.env[.properties]

ai:
  # 服务间共享密钥：NestJS 转发时必须带 X-Internal-Token 头。
  # 留空 = 关闭校验（仅限本地开发），启动时会打 warn。
  internal-token: ${AI_INTERNAL_TOKEN:}

  # 对话模型：DeepSeek（OpenAI 兼容）
  # 注意模型名是 deepseek-flash / deepseek-v4-pro；旧的 deepseek-chat / deepseek-reasoner 已退役
  chat:
    base-url: ${AI_CHAT_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${AI_CHAT_API_KEY:}
    model: ${AI_CHAT_MODEL:deepseek-flash}
    temperature: 0.7
    timeout: 60s
    # 单会话保留的消息条数（超出后丢弃最早的，控制上下文与成本）
    max-messages: 20

  # 向量模型：SiliconFlow BGE-M3（OpenAI 兼容）
  # 只有配了 api-key 才会创建 EmbeddingModel bean —— M1 不需要它
  embedding:
    base-url: ${AI_EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${AI_EMBEDDING_API_KEY:}
    model: ${AI_EMBEDDING_MODEL:BAAI/bge-m3}
    dimensions: 1024

  # M2：Qdrant REST API。默认使用本机 docker-compose 暴露的 6333 端口。
  qdrant:
    base-url: ${AI_QDRANT_URL:http://127.0.0.1:6333}
    collection: ${AI_QDRANT_COLLECTION:anime_knowledge}
    top-k: ${AI_QDRANT_TOP_K:10}

  # TMDB：分集简介与角色集数（Bangumi 的 episodes.desc 覆盖率仅 17%，不可用）
  # 免费非商业用途；应用内必须署名，缓存不得超过六个月（客户端已内置 24h TTL）
  tmdb:
    base-url: ${AI_TMDB_BASE_URL:https://api.themoviedb.org/3}
    token: ${AI_TMDB_TOKEN:}
    language: ${AI_TMDB_LANGUAGE:zh-CN}

  # 检索行为开关。改这两项只需重启，不用改代码重新发布。
  retrieval:
    # vector / hybrid / rrf / hybrid-rrf；留空即 hybrid
    strategy: ${AI_RETRIEVAL_STRATEGY:hybrid}
    # kill switch：false 时 search_knowledge 直接返回空、不消耗 embedding。
    # 用途：供应商限流/欠费时保住对话主链路，不必回滚发布。
    enabled: ${AI_RETRIEVAL_ENABLED:true}

  # M2：只读 anime 表。未配置时仍可启动 M1；配置后可调用 ingest 接口。
  corpus:
    jdbc-url: ${AI_CORPUS_JDBC_URL:}
    username: ${AI_CORPUS_DB_USERNAME:}
    password: ${AI_CORPUS_DB_PASSWORD:}
    batch-size: ${AI_CORPUS_BATCH_SIZE:64}

  # Bangumi 公开 API（需带 User-Agent）
  bangumi:
    base-url: ${AI_BANGUMI_BASE_URL:https://api.bgm.tv}
    user-agent: ${AI_BANGUMI_UA:anime-ai/0.1 (https://github.com/Amenoe/anime-chat)}
    timeout: 15s

logging:
  level:
    com.animeai: debug
